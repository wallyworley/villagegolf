<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<title>Village Fairways</title>
<style>
  :root { --g1:#0e3d21; --g2:#14532d; --g3:#2f6b45; --bg:#f3f6f1; --card:#fff; --text:#16211a; --muted:#55615a; --edge:#cfe0d4; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10150f; --card:#1a2018; --text:#edf2ea; --muted:#aeb8ae; --edge:#344536; --g2:#2f6b45; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text);
         font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size:18px; line-height:1.55; }
  header { background:linear-gradient(160deg,var(--g1),var(--g2) 55%,var(--g3)); color:#fff;
           padding:calc(14px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 14px max(16px, env(safe-area-inset-left));
           display:flex; align-items:center; gap:12px; }
  .mark { width:40px; height:40px; border-radius:11px; background:#f4f8f2; color:#14532d; display:flex;
          align-items:center; justify-content:center; font-weight:800; font-size:16px; }
  header strong { font-size:20px; }
  main { flex:1; width:100%; max-width:480px; margin:0 auto; padding:32px 16px; }
  .card { background:var(--card); border:1px solid var(--edge); border-radius:16px; padding:24px; }
  h1 { margin:0 0 12px; font-size:26px; line-height:1.2; }
  p { margin:0 0 20px; color:var(--muted); }
  button { width:100%; min-height:52px; border:0; border-radius:12px; background:var(--g2); color:#fff;
           font:inherit; font-size:18px; font-weight:700; cursor:pointer; }
  button:focus-visible { outline:3px solid #d4a94f; outline-offset:3px; }
</style>
</head>
<body>
<header><div class="mark" aria-hidden="true">VF</div><strong>Village Fairways</strong></header>
<main>
  <div class="card">
    <h1>You're offline</h1>
    <p>Village Fairways needs an internet connection to check tee times and reservations. Check your Wi-Fi or cellular connection, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</main>
</body>
</html>
